
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - E-Commerce</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fb;
    color: #222;
}

header {
    background: #172554;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin-bottom: 12px;
}

nav {
    display: flex;
    justify-content: center;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    padding: 20px;
    max-width: 1100px;
    margin: auto;
}

.search-box {
    width: 100%;
    padding: 13px;
    margin: 20px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
}

.product {
    background: white;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 10px #00000010;
}

.product .emoji {
    font-size: 65px;
    margin: 15px;
}

.product h3 {
    margin-bottom: 10px;
}

.product p {
    margin: 10px;
    color: #444;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 11px 16px;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 8px;
}

button:hover {
    background: #1d4ed8;
}

.cart {
    margin-top: 35px;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.cart-item {
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.remove-btn {
    background: #dc2626;
    padding: 7px 10px;
}

#total {
    font-weight: bold;
    font-size: 20px;
    margin-top: 15px;
}

footer {
    margin-top: 35px;
    background: #172554;
    color: white;
    text-align: center;
    padding: 20px;
}

</style>
</head>

<body>

<header>
    <h1>🛍️ ShopEase</h1>
    <p>Your Online Shopping Store</p>
    <nav>
        <a href="#products">Products</a>
        <a href="#cart">Cart 🛒 <span id="cartCount">0</span></a>
    </nav>
</header>

<div class="container">

    <h2>Our Products</h2>

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search products..."
        oninput="searchProducts()"
    >

    <div class="products" id="productList"></div>

    <section class="cart" id="cart">
        <h2>🛒 Shopping Cart</h2>
        <div id="cartItems">Your cart is empty.</div>
        <p id="total">Total: ₹0</p>
        <button onclick="checkout()">Place Order</button>
    </section>

</div>

<footer>
    <p>© 2026 ShopEase E-Commerce Platform</p>
</footer>

<script>

const products = [
    {id: 1, name: "Headphones", price: 999, emoji: "🎧"},
    {id: 2, name: "Smart Watch", price: 1499, emoji: "⌚"},
    {id: 3, name: "Shoes", price: 1999, emoji: "👟"},
    {id: 4, name: "Backpack", price: 799, emoji: "🎒"},
    {id: 5, name: "Camera", price: 4999, emoji: "📷"},
    {id: 6, name: "Phone", price: 8999, emoji: "📱"}
];

let cart = [];

function displayProducts(items) {
    const productList = document.getElementById("productList");

    productList.innerHTML = "";

    items.forEach(product => {
        productList.innerHTML += `
            <div class="product">
                <div class="emoji">${product.emoji}</div>
                <h3>${product.name}</h3>
                <p>Price: ₹${product.price}</p>
                <button onclick="addToCart(${product.id})">
                    Add to Cart
                </button>
            </div>
        `;
    });
}

function searchProducts() {
    const query = document.getElementById("searchInput")
        .value.toLowerCase();

    const filtered = products.filter(product =>
        product.name.toLowerCase().includes(query)
    );

    displayProducts(filtered);
}

function addToCart(id) {
    const product = products.find(item => item.id === id);
    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }

    displayCart();
}

function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    displayCart();
}

function displayCart() {
    const cartItems = document.getElementById("cartItems");
    const cartCount = document.getElementById("cartCount");

    cartCount.textContent = cart.reduce(
        (sum, item) => sum + item.quantity, 0
    );

    if (cart.length === 0) {
        cartItems.innerHTML = "Your cart is empty.";
    } else {
        cartItems.innerHTML = cart.map(item => `
            <div class="cart-item">
                ${item.emoji} ${item.name} × ${item.quantity}
                — ₹${item.price * item.quantity}
                <button class="remove-btn"
                    onclick="removeFromCart(${item.id})">
                    Remove
                </button>
            </div>
        `).join("");
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity, 0
    );

    document.getElementById("total").textContent =
        "Total: ₹" + total;
}

function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    alert("Order placed successfully! Thank you for shopping.");

    cart = [];
    displayCart();
}

displayProducts(products);
displayCart();

</script>

</body>
</html>
